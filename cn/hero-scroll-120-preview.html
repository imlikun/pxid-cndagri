<main>
  <section class="scroll-story" id="scrollStory" aria-label="MANTIS P6 滚动空间展示">
    <div class="scroll-stage" id="scrollStage" data-frame="0" data-progress="0" aria-busy="true">
      <div class="ambient-photo" aria-hidden="true"></div>
      <div class="media-window" id="mediaWindow">
        <img class="sequence-poster" id="sequencePoster" src="../assets/pxid/home/scroll120/00000.webp" alt="绿色 MANTIS P6，山景中的车头视角">
        <canvas id="sequenceCanvas" aria-label="随页面滚动改变视角的 MANTIS P6"></canvas>
        <img class="destination-photo" id="destinationPhoto" src="../assets/pxid/home/mantis-mountain.png" alt="MANTIS P6 全地形电动自行车">
        <div class="picture-grade" aria-hidden="true"></div>
        <span class="picture-corner corner-one" aria-hidden="true"></span><span class="picture-corner corner-two" aria-hidden="true"></span>
      </div>
      <div class="opening-copy" id="openingCopy">
        <p class="eyebrow">MANTIS / ALL-TERRAIN</p>
        <h1>P6<span>.</span></h1>
        <p class="opening-line">生而向野。</p>
        <p class="opening-note">从一个视角，走向更多可能。</p>
      </div>
      <div class="next-copy" id="nextCopy" aria-hidden="true" inert>
        <p class="eyebrow">PXID / ELECTRIC MOBILITY</p>
        <h2>BUILT<br>TO <span>MOVE.</span></h2>
        <p class="next-chinese">从设计，到真正上路。</p>
        <p class="next-description">把产品构想，转化为可以交付的出行方案。</p>
        <a class="product-cta" href="business.html">探索产品方案 <span>↗</span></a>
        <div class="model-choices" role="group" aria-label="选择车型">
          <button type="button" class="is-current" data-model="0" aria-pressed="true">P6 <small>全地形</small></button>
          <button type="button" data-model="1" aria-pressed="false">P2 <small>折叠</small></button>
          <button type="button" data-model="2" aria-pressed="false">M2 <small>城市</small></button>
        </div>
      </div>
      <div class="stage-bottom">
        <button class="scroll-cue" type="button" id="scrollCue"><span class="mouse-mark"><i></i></span><span id="cueText">向下滚动，改变视角</span><b>↓</b></button>
        <div class="frame-counter" aria-hidden="true"><b id="currentFrame">001</b><span>/</span><span>120</span></div>
        <button type="button" class="replay" id="replay">重新体验 <span>↺</span></button>
      </div>
      <div class="loading-line" id="loadingLine" aria-hidden="true"><span id="loadingFill"></span></div>
      <div class="scroll-progress" aria-hidden="true"><span id="progressFill"></span></div>
      <span class="image-cursor" id="imageCursor" aria-hidden="true"><span id="cursorLabel">向下探索</span><b>↓</b></span>
      <button class="motion-button" type="button" id="motionButton" aria-label="调整跟随速度" aria-expanded="false">跟随设置 <span>＋</span></button>
      <div class="motion-panel" id="motionPanel" hidden>
        <label for="followSpeed">跟随感</label><select id="followSpeed"><option value="0.22" selected>平滑</option><option value="0.08">紧跟</option><option value="0.35">舒缓</option></select>
        <label class="check-label"><input type="checkbox" id="reduceMotion">简化动态</label>
        <p>向下推进，向上回看。</p>
      </div>
      <span class="sr-only" id="sequenceStatus" role="status" aria-live="polite">正在准备图片序列</span>
    </div>
